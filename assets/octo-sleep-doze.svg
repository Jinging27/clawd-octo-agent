<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<style>
@keyframes breatheSlow{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-5px) rotate(1deg)}}
@keyframes wobble{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes shakeHard{0%,100%{transform:translate(0,0)}20%{transform:translate(-3px,1px)}40%{transform:translate(3px,-1px)}60%{transform:translate(-2px,2px)}80%{transform:translate(2px,-1px)}}
@keyframes wave{0%,100%{transform:rotate(0deg)}50%{transform:rotate(18deg)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(0.5)}50%{opacity:1;transform:translate(8px,-15px) scale(1)}100%{opacity:0;transform:translate(16px,-30px) scale(0.8)}}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}60%{transform:translateY(-2px)}}
</style>
<g style="animation:breatheSlow 4s ease-in-out infinite"><g transform="translate(100,146)"><ellipse cx="-32" cy="10" rx="10" ry="19" fill="#9B6BB0" opacity="0.9"/><ellipse cx="-32" cy="24" rx="7" ry="6" fill="#B08ACC"/><ellipse cx="-16" cy="13" rx="10" ry="21" fill="#9B6BB0"/><ellipse cx="-16" cy="29" rx="7" ry="6" fill="#B08ACC"/><ellipse cx="0" cy="14" rx="10" ry="22" fill="#9B6BB0"/><ellipse cx="0" cy="31" rx="7" ry="6" fill="#B08ACC"/><ellipse cx="16" cy="13" rx="10" ry="21" fill="#9B6BB0"/><ellipse cx="16" cy="29" rx="7" ry="6" fill="#B08ACC"/><ellipse cx="32" cy="10" rx="10" ry="19" fill="#9B6BB0" opacity="0.9"/><ellipse cx="32" cy="24" rx="7" ry="6" fill="#B08ACC"/></g><ellipse cx="100" cy="106" rx="50" ry="47" fill="#C8A2D8"/><ellipse cx="96" cy="100" rx="20" ry="15" fill="#D8BAE8" opacity="0.25"/><ellipse cx="72" cy="117" rx="8" ry="5" fill="#F4A0B0" opacity="0.5"/><ellipse cx="128" cy="117" rx="8" ry="5" fill="#F4A0B0" opacity="0.5"/>
<ellipse cx="85" cy="104" rx="10" ry="5.5" fill="#2D2D2D"/><ellipse cx="84" cy="102" rx="4" ry="3" fill="#FFFFFF"/><ellipse cx="115" cy="104" rx="10" ry="5.5" fill="#2D2D2D"/><ellipse cx="114" cy="102" rx="4" ry="3" fill="#FFFFFF"/>
<path d="M96,124 Q100,127 104,124" stroke="#E87090" stroke-width="1.8" fill="none" stroke-linecap="round"/>
<g opacity="0.7"><text x="145" y="65" font-size="12" fill="#7B68AE" font-family="sans-serif" font-weight="bold" style="animation:zz 2s infinite">Z</text><text x="153" y="55" font-size="9" fill="#7B68AE" font-family="sans-serif" font-weight="bold" style="animation:zz 2s infinite .5s">Z</text><text x="159" y="47" font-size="7" fill="#7B68AE" font-family="sans-serif" font-weight="bold" style="animation:zz 2s infinite 1s">z</text></g></g>
<ellipse cx="100" cy="170" rx="48" ry="7" fill="#D4C7E0" opacity="0.45"/>
</svg>