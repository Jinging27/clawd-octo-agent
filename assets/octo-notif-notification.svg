<ellipse cx="85" cy="91" rx="13.00" ry="15.00" fill="#BA97C9" style="transform-origin:85px 76.00px;animation:blink 5.8s ease-in-out infinite"/><ellipse cx="115" cy="91" rx="13.00" ry="15.00" fill="#BA97C9" style="transform-origin:115px 76.00px;animation:blink 5.8s ease-in-out infinite"/><path d="M93,111 Q100,117 107,111" stroke="#E87090" stroke-width="2.3" fill="none" stroke-linecap="round"/></g><ellipse cx="145" cy="83" rx="9" ry="6" fill="#9B6BB0"/><ellipse cx="145" cy="88" rx="6" ry="4.5" fill="#B08ACC"/><rect x="131" y="46" width="34" height="25" rx="4" fill="#F2788C" style="animation:glow 1.5s ease-in-out infinite"/><text x="138" y="57" font-size="7" fill="#FFFFFF" font-weight="bold" font-family="sans-serif">Allow?</text><circle cx="155" cy="42" r="4.5" fill="#F2788C" opacity="0.4" style="animation:pulse 1s ease-in-out infinite"/>
