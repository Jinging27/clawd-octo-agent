<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<style>
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes look{0%,100%{transform:translateX(0)}50%{transform:translateX(2px)}}
@keyframes wobble{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(0.5)}50%{opacity:1;transform:translate(6px,-12px) scale(1)}100%{opacity:0;transform:translate(12px,-24px) scale(0.8)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
</style>
<rect x="0" y="133" width="200" height="67" fill="#D4C7E0" opacity="0.12"/><g style="animation:float 2.5s ease-in-out infinite"><ellipse cx="100" cy="153" rx="4.5" ry="6" fill="#9B6BB0" opacity="0.5"/><ellipse cx="90" cy="154" rx="3.5" ry="5" fill="#9B6BB0" opacity="0.4"/><ellipse cx="110" cy="154" rx="3.5" ry="5" fill="#9B6BB0" opacity="0.4"/><ellipse cx="100" cy="140" rx="22" ry="18" fill="#C8A2D8"/><ellipse cx="97" cy="135" rx="10" ry="7" fill="#D8BAE8" opacity="0.25"/><ellipse cx="92" cy="139" rx="4.5" ry="5.5" fill="#2D2D2D"/><ellipse cx="91" cy="137" rx="2" ry="2" fill="#FFFFFF"/><ellipse cx="108" cy="139" rx="4.5" ry="5.5" fill="#2D2D2D"/><ellipse cx="107" cy="137" rx="2" ry="2" fill="#FFFFFF"/><ellipse cx="84" cy="145" rx="4" ry="2.5" fill="#F4A0B0" opacity="0.4"/><ellipse cx="116" cy="145" rx="4" ry="2.5" fill="#F4A0B0" opacity="0.4"/></g>
</svg>