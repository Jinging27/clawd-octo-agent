form-origin:115px 79.00px;animation:blink 5.8s ease-in-out infinite"/><path d="M92,113 Q96,116 100,113 Q104,110 108,113" stroke="#E87090" stroke-width="1.8" fill="none" stroke-linecap="round"/></g><circle cx="148" cy="62" r="13" fill="#FFFFFF" opacity="0.85"/><circle cx="141" cy="74" r="5.5" fill="#FFFFFF" opacity="0.6"/><circle cx="137" cy="81" r="3" fill="#FFFFFF" opacity="0.4"/><text x="142" y="69" font-size="14" fill="#7B68AE" font-weight="bold">?</text><rect x="53" y="40" width="13" height="18" rx="2" fill="#D4A574" stroke="#B8956A" stroke-width="0.8"/><line x1="56" y1="44" x2="63" y2="44" stroke="#8B6914" stroke-width="0.7"/><line x1="56" y1="48" x2="63" y2="48" stroke="#8B6914" stroke-width="0.7"/><line x1="56" y1="52" x2="61" y2="52" stroke="#8B6914" stroke-width="0.7"/>
